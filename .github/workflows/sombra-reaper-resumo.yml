# Resumo consolidado da sombra do reaper KAS: baixa os relatórios criptografados das execuções
# dos últimos dias, junta e avalia os critérios (docs/event-reaper/SOMBRA.md §5).
# Diário às 09:00 (BRT) enquanto a sombra estiver ativa; manual a qualquer hora.
# Publica só contagens. O veredito dos 5 dias é a execução com min_days=5.
name: sombra-reaper-resumo

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:
    inputs:
      days:
        description: 'Quantos dias de execuções juntar'
        required: false
        default: '6'
      min_days:
        description: 'Período mínimo para aprovar (5 = veredito final; 0 = parcial)'
        required: false
        default: '0'

permissions:
  contents: read
  actions: read

jobs:
  resumo:
    if: github.repository == 'kaduart/kas-core' && vars.SOMBRA_REAPER_ATIVA == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DAYS: ${{ github.event.inputs.days || '6' }}
      MIN_DAYS: ${{ github.event.inputs.min_days || '0' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - run: go build -o bin/kas-shadow-summary ./cmd/kas-shadow-summary
      - name: Baixar e decifrar os relatórios
        env:
          PASS: ${{ secrets.SOMBRA_REPORT_PASSPHRASE }}
        run: |
          since=$(date -u -d "-${DAYS} days" +%Y-%m-%dT%H:%M:%SZ)
          mkdir -p dl all
          gh run list -R "$GITHUB_REPOSITORY" -w sombra-reaper.yml -L 200 --json databaseId,createdAt,status \
            -q ".[] | select(.status==\"completed\" and .createdAt >= \"$since\") | .databaseId" > runs.txt
          echo "execuções no período: $(wc -l < runs.txt)"
          while read -r id; do
            gh run download "$id" -R "$GITHUB_REPOSITORY" -D "dl/$id" >/dev/null 2>&1 || continue
            for f in dl/$id/*/*.gpg; do
              [ -f "$f" ] || continue
              printf '%s' "$PASS" | gpg --batch --quiet --pinentry-mode loopback --passphrase-fd 0 -d "$f" | tar xz -C "dl/$id"
              [ -f "dl/$id/run/report.jsonl" ] && cp "dl/$id/run/report.jsonl" "all/report-$id.jsonl"
              [ -f "dl/$id/run/health.jsonl" ] && cp "dl/$id/run/health.jsonl" "all/health-$id.jsonl"
            done
          done < runs.txt
          ls all | wc -l
      - name: Avaliar os critérios
        run: |
          ls all/report-*.jsonl >/dev/null 2>&1 || { echo "nenhum relatório no período" >> "$GITHUB_STEP_SUMMARY"; exit 0; }
          H=$(ls all/health-*.jsonl 2>/dev/null | paste -sd, -)
          set +e
          bin/kas-shadow-summary -min-days "$MIN_DAYS" ${H:+-health "$H"} all/report-*.jsonl > summary.md
          rc=$?
          set -e
          cat summary.md >> "$GITHUB_STEP_SUMMARY"
          case $rc in
            0) echo "VEREDITO: todos os critérios passam" >> "$GITHUB_STEP_SUMMARY" ;;
            3) echo "VEREDITO: nada reprovado; período ainda curto" >> "$GITHUB_STEP_SUMMARY" ;;
            *) echo "VEREDITO: há critério reprovado"   >> "$GITHUB_STEP_SUMMARY"; exit 1 ;;
          esac
          rm -rf dl all
