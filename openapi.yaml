openapi: 3.1.0
info:
  title: KAS Core Pilot API
  version: v1
  description: >-
    Local pilot API for shared tenant configuration and audit recording. Service
    access requires both tenant authorization and an explicit service capability
    in the startup JSON configuration. This document describes the behavior in
    the current Go executable; it is not a production-readiness claim.
x-server-limits:
  max-concurrent-default: 32
  max-concurrent-minimum: 1
  max-concurrent-maximum: 128
  max-header-bytes: 8192
  read-header-timeout: 2s
  read-timeout: 3s
  write-timeout: 3s
  idle-timeout: 30s
servers:
  - url: http://127.0.0.1:8088
    description: Local loopback default; non-loopback listeners require TLS.
tags:
  - name: Health
  - name: Configuration
  - name: Audit
  - name: Events
  - name: Modules
  - name: Attribution
  - name: Reports
paths:
  /healthz:
    get:
      tags: [Health]
      summary: Liveness response
      description: Returns a static status response; no authentication is required.
      parameters:
        - $ref: '#/components/parameters/CorrelationID'
      responses:
        '200':
          description: Process is serving HTTP requests.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '400':
          $ref: '#/components/responses/InvalidCorrelation'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '503':
          $ref: '#/components/responses/ServerUnavailable'
  /readyz:
    get:
      tags: [Health]
      summary: Readiness response
      description: >-
        Same response as /healthz while audit storage is ready; no authentication
        is required. When audit is enabled and its storage is not ready (a failed
        JSON Lines write, a closed store, or a PostgreSQL ping that fails or exceeds
        3 seconds) it returns 503 audit_unavailable without storage details.
      parameters:
        - $ref: '#/components/parameters/CorrelationID'
      responses:
        '200':
          description: Process is serving HTTP requests.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '400':
          $ref: '#/components/responses/InvalidCorrelation'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '503':
          $ref: '#/components/responses/ServerUnavailable'
  /metrics:
    get:
      tags: [Health]
      summary: Prometheus metrics
      description: >-
        Prometheus text exposition (version 0.0.4). Labels are fixed values only:
        route (a fixed list; anything else is "other"), status code, delivery state
        and token slot. No tenant, service or token appears in any label. Served
        before the concurrency limiter and while draining. Present only when the
        endpoint is enabled (loopback listener, or -metrics-token-env set).
      operationId: getMetrics
      security:
        - {}
        - MetricsBearer: []
      responses:
        '200':
          description: Metrics in the Prometheus text format.
          content:
            text/plain:
              schema:
                type: string
        '401':
          description: A token is required and was missing or wrong.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: The endpoint is not enabled.
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
  /internal/v1/config/evaluate:
    post:
      tags: [Configuration]
      summary: Evaluate a tenant configuration value
      description: >-
        Requires a valid service token, an active registered tenant authorized
        for that service, and the service capability `config:read`. The tenant in the
        body selects the requested tenant but grants no authority by itself.
        Capabilities are fixed at startup in the server configuration; omitted
        capabilities deny access by default.
      operationId: evaluateConfig
      security:
        - ServiceIdentity: []
          ServiceBearer: []
      parameters:
        - $ref: '#/components/parameters/CorrelationID'
      requestBody:
        required: true
        description: Strict JSON; unknown and duplicate keys are rejected. Global request concurrency is configured by max-concurrent (default 32, allowed range 1–128).
        x-max-body-bytes: 4096
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfigEvaluationRequest'
      responses:
        '200':
          description: Value was evaluated from the in-memory configuration snapshot.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationID'
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigEvaluationResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Tenant or requested capability is not authorized, or the tenant is inactive.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Tenant is unknown or has no value for the requested key.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          description: Key is unknown or the requested type differs from the declared type.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected evaluation failure.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          $ref: '#/components/responses/ServerUnavailable'
  /internal/v1/events:
    post:
      tags: [Events]
      summary: Publish an event to the outbox
      description: >-
        Requires a valid service token, an active registered tenant authorized
        for that service, and the capability `events:publish`. Body service_id
        must equal X-KAS-Service and event_type must be declared in the
        configuration. The payload is a JSON object of at most 16 KiB containing
        identifiers only (no clinical or personal data): identifier-shaped
        strings, 64-bit integers and booleans, no nesting. The event identity is
        (tenant_id, service_id, event_id): an identical resend returns 200 with the
        originally stored event and writes nothing; the same identity with
        different content returns 409 event_conflict. Delivery to consumers is
        at-least-once and unordered.
      operationId: publishEvent
      security:
        - ServiceIdentity: []
          ServiceBearer: []
      parameters:
        - $ref: '#/components/parameters/CorrelationID'
      requestBody:
        required: true
        x-max-body-bytes: 20480
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventSubmission'
      responses:
        '201':
          description: Event and its deliveries were committed to PostgreSQL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventResponse'
        '200':
          description: Identical resend; nothing was written and the original event is returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventResponse'
        '400':
          description: invalid_request or invalid_event (including a payload outside the allowed shape).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Tenant/capability denied, tenant inactive, or body service_id mismatch.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Tenant is not registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '409':
          description: The same (tenant_id, service_id, event_id) was already published with different content (event_conflict).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          description: The event type is not declared in the configuration (unknown_event_type).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Publication is disabled, capacity is exhausted, or the event could not be durably stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /internal/v1/events/deliveries/claim:
    post:
      tags: [Events]
      summary: Claim due deliveries for a pull consumer
      description: >-
        Requires events:consume and a consumer bound to the authenticated service.
        The scope is the consumer's event types and tenants intersected with the
        service's own tenants (inactive tenants excluded); the request cannot widen
        it. Up to 50 deliveries are leased for 5 to 300 seconds. Claiming counts as
        an attempt. The lease_token is a secret for this claim. Delivery is
        at-least-once and unordered.
      operationId: claimEventDeliveries
      security:
        - ServiceIdentity: []
          ServiceBearer: []
      requestBody:
        required: true
        x-max-body-bytes: 4096
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClaimRequest'
      responses:
        '200':
          description: Leased deliveries; the list is empty when nothing is due.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimResponse'
        '400':
          description: invalid_request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: capability_forbidden or consumer_forbidden (unknown, unbound, or another service's consumer).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '503':
          description: events_unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /internal/v1/events/deliveries/ack:
    post:
      tags: [Events]
      summary: Confirm a claimed delivery
      description: >-
        Applies only when delivery_id, attempt, consumer_id and lease_token match
        the current lease. A repeated ack of an already delivered attempt returns 200.
      operationId: ackEventDelivery
      security:
        - ServiceIdentity: []
          ServiceBearer: []
      requestBody:
        required: true
        x-max-body-bytes: 4096
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettleRequest'
      responses:
        '200':
          description: The delivery is delivered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettleResponse'
        '400':
          description: invalid_request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: capability_forbidden or consumer_forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '409':
          description: lease_lost; nothing changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '503':
          description: events_unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /internal/v1/events/deliveries/nack:
    post:
      tags: [Events]
      summary: Reject a claimed delivery
      description: >-
        Returns the delivery to pending after exponential backoff with jitter, or
        marks it dead when permanent is true or the attempts are used up. Applies
        only for the current lease; a repeat answers 409 lease_lost.
      operationId: nackEventDelivery
      security:
        - ServiceIdentity: []
          ServiceBearer: []
      requestBody:
        required: true
        x-max-body-bytes: 4096
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NackRequest'
      responses:
        '200':
          description: The delivery is pending again (with next_attempt_at) or dead.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettleResponse'
        '400':
          description: invalid_request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: capability_forbidden or consumer_forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '409':
          description: lease_lost; nothing changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '503':
          description: events_unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /internal/v1/modules:
    get:
      tags: [Modules]
      summary: Module catalog view of the authenticated tenant
      description: >-
        Lists every module of the fixed catalog with its contract state for the
        tenant (`active`, `paused`, `absent` or `planned`), its dependencies, the
        integration readiness when the module registered a check, and the
        capabilities of that module the calling service holds. Any authenticated
        service of an active tenant it is authorized for may read the view; the
        tenant is resolved like the other routes. Module refusals on other routes
        answer 403 `module_not_contracted` or `module_paused` and are recorded in
        the tenant's audit trail (action `module.access_denied`).
      operationId: getModules
      security:
        - ServiceIdentity: []
          ServiceBearer: []
      parameters:
        - $ref: '#/components/parameters/CorrelationID'
        - name: tenant_id
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/TenantID'
          description: Required only for a service allowed for several tenants.
      responses:
        '200':
          description: Module states of the tenant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModulesResponse'
        '400':
          description: tenant_required, invalid_request or invalid_correlation_id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Service authentication failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: tenant_inactive or tenant_forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: tenant_not_found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '503':
          description: module_readiness_unavailable or server unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /internal/v1/attribution/{kind}:batch:
    post:
      tags: [Attribution]
      summary: Import one batch of generic Attribution inputs
      description: >-
        Requires the capability `attribution:import` and the module `attribution`
        contracted and active for the tenant. `kind` is customers, contacts,
        receipts or refunds; columns per kind are in contract/v1/attribution.md.
        Idempotent by batch (same batch_id and content returns the original answer
        with 200 and `duplicate: true`; other content is 409 `batch_conflict`) and
        by item (tenant + kind + external_id: same content is `unchanged`, other
        content is a new version, `voided: true` removes the item from reports as
        a new version). Invalid lines are listed in `rejected` without stopping the
        batch. Phones and e-mails are turned into keyed fingerprints and never
        stored. Each new batch is audited (`attribution.batch_imported`) with
        identifiers only.
      operationId: importAttributionBatch
      security:
        - ServiceIdentity: []
          ServiceBearer: []
      parameters:
        - $ref: '#/components/parameters/CorrelationID'
        - name: kind
          in: path
          required: true
          schema:
            type: string
            enum: [customers, contacts, receipts, refunds]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttributionBatchRequest'
      responses:
        '200':
          description: Replay of a stored batch; nothing was written.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttributionBatchResponse'
        '201':
          description: Batch stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttributionBatchResponse'
        '400':
          description: invalid_request, invalid_batch, unsupported_contract_version, tenant_required or invalid_correlation_id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Service authentication failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: tenant_inactive, tenant_forbidden, capability_forbidden, module_not_contracted or module_paused.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: batch_conflict.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: payload_too_large (limit 1 MiB).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          description: unsupported_media_type.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: attribution_unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /internal/v1/attribution/revenue:
    get:
      tags: [Attribution]
      summary: Revenue by campaign with level of evidence
      description: >-
        Requires `attribution:read` and the module `attribution` active. Computes
        the report from the latest, not voided version of every input of the
        tenant (model primeiro-contato-por-recebimento-v1). Values are integer
        cents (BRL). The invariant `invariante.fecha` is true when the levels add
        up to the net total. `from`/`to` filter by cash date and accept RFC 3339
        or YYYY-MM-DD (UTC; a plain `to` date includes the whole day).
      operationId: getAttributionRevenue
      security:
        - ServiceIdentity: []
          ServiceBearer: []
      parameters:
        - $ref: '#/components/parameters/CorrelationID'
        - {name: tenant_id, in: query, required: false, schema: {$ref: '#/components/schemas/TenantID'}}
        - {name: from, in: query, required: false, schema: {type: string}}
        - {name: to, in: query, required: false, schema: {type: string}}
        - {name: unit, in: query, required: false, schema: {type: string, maxLength: 128}}
        - {name: model, in: query, required: false, schema: {type: string, enum: [primeiro-contato-por-recebimento-v1]}}
        - {name: format, in: query, required: false, schema: {type: string, enum: [json, csv], default: json}}
      responses:
        '200':
          description: The report (JSON, or CSV with one row per line plus sem_vinculo and total rows).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttributionRevenueResponse'
            text/csv:
              schema:
                type: string
        '400':
          description: invalid_request, model_unsupported, tenant_required or invalid_correlation_id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Service authentication failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: tenant_inactive, tenant_forbidden, capability_forbidden, module_not_contracted or module_paused.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: attribution_unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /internal/v1/reports/revenue:
    get:
      tags: [Reports]
      summary: Revenue report for the company (HTML or CSV)
      description: >-
        Requires `reports:read` and the module `reports` active (it depends on
        `attribution`). Same parameters as /internal/v1/attribution/revenue. HTML
        is one self-contained page with the company's branding from the
        configuration keys `branding.name` and `branding.color`; CSV is the same
        as the Attribution CSV.
      operationId: getRevenueReport
      security:
        - ServiceIdentity: []
          ServiceBearer: []
      parameters:
        - $ref: '#/components/parameters/CorrelationID'
        - {name: tenant_id, in: query, required: false, schema: {$ref: '#/components/schemas/TenantID'}}
        - {name: from, in: query, required: false, schema: {type: string}}
        - {name: to, in: query, required: false, schema: {type: string}}
        - {name: unit, in: query, required: false, schema: {type: string, maxLength: 128}}
        - {name: model, in: query, required: false, schema: {type: string, enum: [primeiro-contato-por-recebimento-v1]}}
        - {name: format, in: query, required: false, schema: {type: string, enum: [html, csv], default: html}}
      responses:
        '200':
          description: The report.
          content:
            text/html:
              schema:
                type: string
            text/csv:
              schema:
                type: string
        '400':
          description: invalid_request, model_unsupported, tenant_required or invalid_correlation_id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Service authentication failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: tenant_inactive, tenant_forbidden, capability_forbidden, module_not_contracted or module_paused.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: attribution_unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /internal/v1/audit:
    get:
      tags: [Audit]
      summary: Read audit records of the authenticated tenant
      description: >-
        Requires a valid service token and the capability `audit:read`, which is
        separate from `audit:write`. The tenant comes from the service's own
        authorization: a service allowed for exactly one tenant needs no tenant
        parameter and can only read that tenant; a service allowed for several must
        pass `tenant_id`, which is authorized like any other request, so it can only
        select one of its own active tenants. Records of any other tenant are never
        returned. Order is stable, by recorded_at (the server-assigned `received_at`,
        microsecond resolution) and then by the store's record id. Pagination is by
        an opaque cursor: pass the `next_cursor` of the previous page unchanged.
        Unknown or repeated query parameters are rejected.
      operationId: readAudit
      security:
        - ServiceIdentity: []
          ServiceBearer: []
      parameters:
        - $ref: '#/components/parameters/CorrelationID'
        - name: tenant_id
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/TenantID'
          description: Required only for a service allowed for several tenants.
        - name: entity_type
          in: query
          required: false
          schema:
            type: string
            pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'
        - name: entity_id
          in: query
          required: false
          schema:
            type: string
            pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'
          description: Requires entity_type.
        - name: since
          in: query
          required: false
          schema:
            type: string
            format: date-time
            maxLength: 40
          description: Keep records recorded at or after this RFC3339 instant.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            maxLength: 128
          description: Opaque; use the next_cursor of the previous page.
      responses:
        '200':
          description: One page, possibly empty. next_cursor is absent on the last page.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditPage'
        '400':
          description: invalid_request (unknown or repeated parameter, invalid limit, since or entity value), invalid_cursor, or tenant_required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: capability_forbidden (no audit:read), tenant_forbidden or tenant_inactive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: The selected tenant is not registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '503':
          description: Capacity limit reached or audit storage could not be read.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /internal/v1/audit/events:
    post:
      tags: [Audit]
      summary: Record an audit event
      description: >-
        Requires a valid service token, an active registered tenant authorized
        for that service, and the service capability `audit:write`. Body service_id
        must equal authenticated X-KAS-Service. Actor is an emitter assertion,
        not a user identity verified by KAS. The server returns success only
        after a complete JSON Lines record has been synchronized to local disk.
        The HTTP X-Correlation-ID is diagnostic and is independent of the event's
        correlation_id field. The event identity is (tenant_id, service_id,
        event_id): an identical resend returns 200 with the originally stored
        event and writes nothing; the same identity with different content
        returns 409 event_conflict.
      operationId: recordAuditEvent
      security:
        - ServiceIdentity: []
          ServiceBearer: []
      parameters:
        - $ref: '#/components/parameters/CorrelationID'
      requestBody:
        required: true
        description: Strict JSON with no arbitrary payload or extra properties.
        x-max-body-bytes: 8192
        content:
          application/json:
            schema:
                $ref: '#/components/schemas/AuditEventSubmission'
      responses:
        '201':
          description: Event was stored durably (JSON Lines record synchronized, or PostgreSQL INSERT committed).
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationID'
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditEventResponse'
        '200':
          description: Identical resend of an already stored event; nothing was written and the original event, with its original received_at, is returned.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationID'
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditEventResponse'
        '400':
          description: Request JSON or event fields are invalid.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: The same (tenant_id, service_id, event_id) was already stored with different content (event_conflict).
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Tenant/capability denied, tenant inactive, or body service_id mismatch.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Tenant is not registered.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '503':
          description: Capacity limit reached or audit storage could not be durably written.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  securitySchemes:
    ServiceIdentity:
      type: apiKey
      in: header
      name: X-KAS-Service
      description: Configured service ID; authorization also requires the caller token.
    ServiceBearer:
      type: http
      scheme: bearer
      bearerFormat: 64-character hexadecimal token
      description: >-
        Secret loaded from the service's configured token_env variable at startup.
        During a credential rotation a service may also configure token_env_next;
        both tokens are accepted until the old one is removed (see RUNBOOK.md).
        Never place the token in the JSON body or logs.
    MetricsBearer:
      type: http
      scheme: bearer
      description: >-
        Token named by the -metrics-token-env flag. Without that flag, /metrics is
        served only on a loopback listener and is not registered otherwise.
  parameters:
    CorrelationID:
      name: X-Correlation-ID
      in: header
      required: false
      description: >-
        Optional diagnostic ID. If absent, the server generates 32 lowercase
        hexadecimal characters. If invalid or repeated, the server returns 400
        invalid_correlation_id and supplies a safe generated ID in the response.
        It never affects authentication, authorization, or tenant selection.
      schema:
        type: string
        minLength: 1
        maxLength: 64
        pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$'
  headers:
    CorrelationID:
      description: Preserved valid caller ID or server-generated 32-character hex ID.
      schema:
        type: string
        minLength: 1
        maxLength: 64
        pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$'
  responses:
    InvalidCorrelation:
      description: Invalid or repeated X-Correlation-ID header.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InvalidRequest:
      description: Invalid or repeated X-Correlation-ID, invalid JSON, duplicate/unknown properties, wrong contract version or missing fields.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Service is unknown or the bearer token is missing/invalid.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    MethodNotAllowed:
      description: Method is not supported; response includes Allow.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationID'
        Allow:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    PayloadTooLarge:
      description: Request exceeds the endpoint-specific byte limit.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnsupportedMediaType:
      description: Content-Type must be application/json.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServerUnavailable:
      description: Concurrency limit reached, server is draining, or endpoint dependency is unavailable.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ServiceCapability:
      type: string
      enum: ['config:read', 'audit:write', 'audit:read', 'events:publish', 'events:consume']
      description: >-
        Startup-only capability. Missing/empty caller capability lists grant
        none. Unknown and duplicate values reject configuration loading.
    ServiceCallerConfiguration:
      type: object
      additionalProperties: false
      required: [token_env, tenants]
      properties:
        token_env:
          type: string
          pattern: '^[A-Z][A-Z0-9_]{0,127}$'
          description: Name of an environment variable containing the 64-hex service token; the token itself is not stored here.
        tenants:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/TenantID'
        capabilities:
          type: array
          uniqueItems: true
          default: []
          items:
            $ref: '#/components/schemas/ServiceCapability'
          description: Omitted or empty means no operation capability is granted.
    TenantRegistration:
      type: object
      additionalProperties: false
      required: [id, status]
      properties:
        id:
          $ref: '#/components/schemas/TenantID'
        status:
          type: string
          enum: [active, inactive]
      description: Inactive tenants deny new business operations; audit history is retained.
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status, contract_version]
      properties:
        status:
          type: string
          const: ok
        contract_version:
          type: string
          const: v1
    ConfigEvaluationRequest:
      type: object
      additionalProperties: false
      required: [contract_version, tenant_id, key, expected_type]
      properties:
        contract_version:
          type: string
          const: v1
        tenant_id:
          $ref: '#/components/schemas/TenantID'
        key:
          type: string
          minLength: 1
        expected_type:
          type: string
          enum: [integer, boolean, string]
    ConfigEvaluationResponse:
      type: object
      additionalProperties: false
      required: [contract_version, config_version, tenant_id, key, type, value]
      properties:
        contract_version:
          type: string
          const: v1
        config_version:
          type: string
          maxLength: 80
        tenant_id:
          $ref: '#/components/schemas/TenantID'
        key:
          type: string
        type:
          type: string
          enum: [integer, boolean, string]
        value:
          oneOf:
            - type: integer
              format: int64
            - type: boolean
            - type: string
    ClaimRequest:
      type: object
      additionalProperties: false
      required: [contract_version, consumer_id]
      properties:
        contract_version:
          type: string
          const: v1
        consumer_id:
          type: string
        max_deliveries:
          type: integer
          minimum: 1
          maximum: 50
          default: 10
        lease_seconds:
          type: integer
          minimum: 5
          maximum: 300
          default: 60
    SettleRequest:
      type: object
      additionalProperties: false
      required: [contract_version, consumer_id, delivery_id, attempt, lease_token]
      properties:
        contract_version:
          type: string
          const: v1
        consumer_id:
          type: string
        delivery_id:
          type: integer
          format: int64
          minimum: 1
        attempt:
          type: integer
          minimum: 1
        lease_token:
          type: string
          pattern: '^[0-9a-f]{32}$'
          description: Secret returned by the claim; do not log it.
    NackRequest:
      allOf:
        - $ref: '#/components/schemas/SettleRequest'
        - type: object
          properties:
            permanent:
              type: boolean
              description: Send the delivery straight to dead.
    SettleResponse:
      type: object
      required: [contract_version, status]
      properties:
        contract_version:
          type: string
          const: v1
        status:
          type: string
          enum: [delivered, pending, dead]
        next_attempt_at:
          type: string
          format: date-time
          description: Present only when status is pending.
    ClaimResponse:
      type: object
      additionalProperties: false
      required: [contract_version, deliveries]
      properties:
        contract_version:
          type: string
          const: v1
        deliveries:
          type: array
          maxItems: 50
          items:
            type: object
            additionalProperties: false
            required: [delivery_id, attempt, lease_token, lease_expires_at, event]
            properties:
              delivery_id:
                type: integer
                format: int64
              attempt:
                type: integer
              lease_token:
                type: string
                pattern: '^[0-9a-f]{32}$'
              lease_expires_at:
                type: string
                format: date-time
              event:
                $ref: '#/components/schemas/StoredEvent'
    StoredEvent:
      type: object
      additionalProperties: false
      required: [contract_version, event_id, tenant_id, service_id, event_type, correlation_id, occurred_at, received_at, payload]
      properties:
        contract_version:
          type: string
          const: v1
        event_id:
          $ref: '#/components/schemas/EventID'
        tenant_id:
          $ref: '#/components/schemas/TenantID'
        service_id:
          $ref: '#/components/schemas/ServiceID'
        event_type:
          type: string
        correlation_id:
          $ref: '#/components/schemas/EventCorrelationID'
        occurred_at:
          type: string
          format: date-time
        received_at:
          type: string
          format: date-time
        payload:
          $ref: '#/components/schemas/EventPayload'
    EventPayload:
      type: object
      maxProperties: 32
      propertyNames:
        pattern: '^[a-z][a-z0-9_]{0,63}$'
      additionalProperties:
        oneOf:
          - type: string
            pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'
          - type: integer
            format: int64
          - type: boolean
      description: >-
        At most 16 KiB. Identifiers only; the contract forbids clinical and
        personal data. No nesting, arrays, nulls, fractions or free text.
    EventSubmission:
      type: object
      additionalProperties: false
      required:
        - contract_version
        - event_id
        - tenant_id
        - service_id
        - event_type
        - correlation_id
        - occurred_at
        - payload
      properties:
        contract_version:
          type: string
          const: v1
        event_id:
          $ref: '#/components/schemas/EventID'
        tenant_id:
          $ref: '#/components/schemas/TenantID'
        service_id:
          allOf:
            - $ref: '#/components/schemas/ServiceID'
          description: Must exactly match X-KAS-Service.
        event_type:
          type: string
          maxLength: 80
          pattern: '^[a-z][a-z0-9]*(\.[a-z][a-z0-9_]*)*$'
          description: Must be declared in the configuration event_types.
        correlation_id:
          $ref: '#/components/schemas/EventCorrelationID'
        occurred_at:
          type: string
          maxLength: 40
          format: date-time
        payload:
          $ref: '#/components/schemas/EventPayload'
    EventResponse:
      type: object
      additionalProperties: false
      required: [contract_version, event]
      properties:
        contract_version:
          type: string
          const: v1
        event:
          type: object
          additionalProperties: false
          required:
            - contract_version
            - event_id
            - tenant_id
            - service_id
            - event_type
            - correlation_id
            - occurred_at
            - received_at
            - payload
          properties:
            contract_version:
              type: string
              const: v1
            event_id:
              $ref: '#/components/schemas/EventID'
            tenant_id:
              $ref: '#/components/schemas/TenantID'
            service_id:
              $ref: '#/components/schemas/ServiceID'
            event_type:
              type: string
            correlation_id:
              $ref: '#/components/schemas/EventCorrelationID'
            occurred_at:
              type: string
              format: date-time
            received_at:
              type: string
              format: date-time
              description: Assigned by KAS; for an identical resend, the original value.
            payload:
              $ref: '#/components/schemas/EventPayload'
    AuditEventSubmission:
      type: object
      additionalProperties: false
      required:
        - contract_version
        - event_id
        - tenant_id
        - service_id
        - actor
        - action
        - resource
        - result
        - correlation_id
        - occurred_at
      properties:
        contract_version:
          type: string
          const: v1
        event_id:
          $ref: '#/components/schemas/EventID'
        tenant_id:
          $ref: '#/components/schemas/TenantID'
        service_id:
          allOf:
            - $ref: '#/components/schemas/ServiceID'
          description: Must exactly match X-KAS-Service.
        actor:
          type: string
          minLength: 6
          maxLength: 104
          pattern: '^(user|service|system)\.[a-z0-9][a-z0-9._-]{0,95}$'
          description: Opaque issuer assertion; KAS does not verify a human identity.
        action:
          type: string
          pattern: '^[a-z][a-z0-9]*(\.[a-z][a-z0-9_]*)*$'
        resource:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'
        result:
          type: string
          enum: [success, failure, denied]
        correlation_id:
          $ref: '#/components/schemas/EventCorrelationID'
          description: Event-declared correlation; separate from HTTP X-Correlation-ID.
        occurred_at:
          type: string
          maxLength: 40
          format: date-time
          description: Emitter-supplied RFC3339 time, not independently verified.
        entity_type:
          type: string
          pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'
          description: Optional entity the action was about. Both entity fields or neither; identifiers only.
        entity_id:
          type: string
          pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'
    AuditPage:
      type: object
      additionalProperties: false
      required: [contract_version, items]
      properties:
        contract_version:
          type: string
          const: v1
        items:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/AuditEvent'
        next_cursor:
          type: string
          description: Present only when more records follow.
    AuditEventResponse:
      type: object
      additionalProperties: false
      required: [contract_version, event]
      properties:
        contract_version:
          type: string
          const: v1
        event:
          $ref: '#/components/schemas/AuditEvent'
    AuditEvent:
      type: object
      additionalProperties: false
      required:
        - contract_version
        - event_id
        - tenant_id
        - service_id
        - actor
        - action
        - resource
        - result
        - correlation_id
        - occurred_at
        - received_at
      properties:
        contract_version:
          type: string
          const: v1
        event_id:
          $ref: '#/components/schemas/EventID'
        tenant_id:
          $ref: '#/components/schemas/TenantID'
        service_id:
          $ref: '#/components/schemas/ServiceID'
        actor:
          type: string
          minLength: 6
          maxLength: 104
          pattern: '^(user|service|system)\.[a-z0-9][a-z0-9._-]{0,95}$'
          description: Opaque issuer assertion; KAS does not verify a human identity.
        action:
          type: string
          pattern: '^[a-z][a-z0-9]*(\.[a-z][a-z0-9_]*)*$'
        resource:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'
        result:
          type: string
          enum: [success, failure, denied]
        correlation_id:
          $ref: '#/components/schemas/EventCorrelationID'
        occurred_at:
          type: string
          maxLength: 40
          format: date-time
          description: Emitter-supplied RFC3339 time, not independently verified.
        received_at:
          type: string
          maxLength: 40
          format: date-time
          description: Time assigned by the KAS process on receipt.
        entity_type:
          type: string
          pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'
          description: Optional entity the action was about. Both entity fields or neither; identifiers only.
        entity_id:
          type: string
          pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'
    AttributionItem:
      type: object
      additionalProperties: false
      description: One input. Which fields are allowed or required depends on the kind (contract/v1/attribution.md).
      required: [external_id]
      properties:
        external_id: {type: string, maxLength: 128}
        customer_ref: {type: string, maxLength: 128}
        phone: {type: string, maxLength: 32, description: Fingerprinted on arrival; never stored.}
        email: {type: string, maxLength: 254, description: Fingerprinted on arrival; never stored.}
        unit: {type: string, maxLength: 128}
        source: {type: string, enum: [google_ads, meta_ads, tiktok_ads, instagram, organic, referral, other]}
        campaign: {type: string, maxLength: 128}
        ad_id: {type: string, maxLength: 128}
        gclid: {type: string}
        fbclid: {type: string}
        ttclid: {type: string}
        ctwa_clid: {type: string}
        method: {type: string, maxLength: 32}
        acquisition: {type: boolean}
        contacted_at: {type: string, format: date-time}
        amount_cents: {type: integer, format: int64, minimum: 1}
        received_at: {type: string, format: date-time}
        payment_ref: {type: string, maxLength: 128}
        receipt_ref: {type: string, maxLength: 128}
        refunded_at: {type: string, format: date-time}
        voided: {type: boolean}
    AttributionBatchRequest:
      type: object
      additionalProperties: false
      required: [contract_version, batch_id, actor, items]
      properties:
        contract_version: {type: string, enum: [v1]}
        tenant_id: {$ref: '#/components/schemas/TenantID'}
        batch_id: {type: string, maxLength: 128}
        actor: {type: string, pattern: '^(user|service|system)\.[a-z0-9][a-z0-9._-]{0,95}$'}
        items:
          type: array
          minItems: 1
          maxItems: 500
          items: {$ref: '#/components/schemas/AttributionItem'}
    AttributionBatchResponse:
      type: object
      required: [contract_version, tenant_id, batch_id, kind, created, updated, unchanged, rejected, duplicate]
      properties:
        contract_version: {type: string}
        tenant_id: {type: string}
        batch_id: {type: string}
        kind: {type: string}
        created: {type: integer}
        updated: {type: integer}
        unchanged: {type: integer}
        duplicate: {type: boolean}
        rejected:
          type: array
          items:
            type: object
            required: [index, code]
            properties:
              index: {type: integer, description: Position of the item in the batch (0-based).}
              external_id: {type: string}
              code: {type: string}
    AttributionRevenueResponse:
      type: object
      required: [contract_version, tenant_id, moeda, total_liquido_centavos, por_nivel_centavos, linhas, sem_vinculo, invariante, regras]
      properties:
        contract_version: {type: string}
        tenant_id: {type: string}
        from: {type: string, format: date-time}
        to: {type: string, format: date-time}
        unit: {type: string}
        moeda: {type: string, enum: [BRL]}
        total_liquido_centavos: {type: integer, format: int64}
        por_nivel_centavos:
          type: object
          additionalProperties: {type: integer, format: int64}
        linhas:
          type: array
          items:
            type: object
            properties:
              nivel: {type: string, enum: [comprovada, provavel]}
              origem: {type: string}
              campanha: {type: string}
              ad_id: {type: string}
              recebido_centavos: {type: integer}
              estornos_centavos: {type: integer}
              liquido_centavos: {type: integer}
              clientes: {type: integer}
              lancamentos: {type: integer}
              motivos_por_lancamento: {type: object, additionalProperties: {type: integer}}
        sem_vinculo:
          type: object
          properties:
            recebido_centavos: {type: integer}
            estornos_centavos: {type: integer}
            liquido_centavos: {type: integer}
            clientes: {type: integer}
            lancamentos: {type: integer}
            motivos_centavos: {type: object, additionalProperties: {type: integer}}
        invariante:
          type: object
          properties:
            soma_niveis_centavos: {type: integer}
            total_liquido_centavos: {type: integer}
            fecha: {type: boolean}
        regras: {type: object, additionalProperties: {type: string}}
    ModulesResponse:
      type: object
      additionalProperties: false
      required: [contract_version, tenant_id, config_version, modules]
      properties:
        contract_version:
          const: v1
        tenant_id:
          $ref: '#/components/schemas/TenantID'
        config_version:
          type: string
        modules:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [key, contract]
            properties:
              key:
                type: string
                enum: [attribution, reports, process, crm, omnichannel, ai]
              contract:
                type: string
                enum: [active, paused, absent, planned]
              depends_on:
                type: array
                items:
                  type: string
              integration:
                type: object
                additionalProperties: false
                required: [ready, missing]
                properties:
                  ready:
                    type: boolean
                  missing:
                    type: array
                    items:
                      type: string
              caller_capabilities:
                type: array
                items:
                  type: string
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [contract_version, error]
      properties:
        contract_version:
          type: string
          const: v1
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - invalid_correlation_id
                - server_shutting_down
                - capacity_exceeded
                - audit_unavailable
                - unsupported_media_type
                - payload_too_large
                - invalid_request
                - unauthorized
                - tenant_not_found
                - tenant_inactive
                - tenant_forbidden
                - capability_forbidden
                - service_identity_mismatch
                - invalid_event
                - unknown_key
                - type_mismatch
                - config_not_found
                - internal_error
            message:
              type: string
    TenantID:
      type: string
      minLength: 1
      maxLength: 64
      pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$'
    ServiceID:
      type: string
      minLength: 1
      maxLength: 64
      pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$'
    EventID:
      type: string
      minLength: 1
      maxLength: 128
      pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'
    EventCorrelationID:
      type: string
      minLength: 1
      maxLength: 128
      pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'
x-startup-configuration:
  tenant_registry:
    type: array
    items:
      $ref: '#/components/schemas/TenantRegistration'
  callers:
    type: object
    additionalProperties:
      $ref: '#/components/schemas/ServiceCallerConfiguration'
