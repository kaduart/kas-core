# Resumo consolidado da sombra do reaper KAS: baixa os relatórios criptografados das execuções
# dos últimos dias, junta e avalia os critérios (docs/event-reaper/SOMBRA.md §5).
# Diário às 09:47 (BRT) só com SOMBRA_AGENDA_ATIVA=true; manual a qualquer hora (na main).
# Publica só contagens. Janela oficial (docs/event-reaper/SOMBRA.md §7): 23/11 00h → 28/11 00h BRT,
# nas variáveis SOMBRA_JANELA_INICIO/SOMBRA_JANELA_FIM (com esses valores como padrão). Sem since/until
# manuais, o resumo escolhe sozinho:
#   - antes do início: aquecimento, sem janela (não conta para o veredito);
#   - durante: parcial, da abertura da janela até agora (período ainda curto, saída 3 esperada);
#   - depois do fim: VEREDITO, janela inteira com min_days=5.
# Zero candidatos ou zero conferências = INCONCLUSIVO (saída 4), mesmo com ciclos saudáveis.
name: sombra-reaper-resumo

on:
  schedule:
    - cron: '47 12 * * *'
  workflow_dispatch:
    inputs:
      days:
        description: 'Quantos dias de execuções juntar'
        required: false
        default: '6'
      min_days:
        description: 'Período mínimo para aprovar (vazio = automático: 5 depois do fim da janela, 0 antes)'
        required: false
        default: ''
      since:
        description: 'Início da janela, RFC3339. Vazio = janela oficial automática (2026-11-23T00:00:00-03:00)'
        required: false
        default: ''
      until:
        description: 'Fim da janela, exclusivo. Vazio = janela oficial automática (2026-11-28T00:00:00-03:00)'
        required: false
        default: ''

permissions:
  contents: read
  actions: read

jobs:
  resumo:
    # Só a main: o ambiente "sombra" tem regra de branch = main e guarda os segredos.
    # Disparo manual a partir de outra branch não recebe credenciais.
    if: >-
      github.repository == 'kaduart/kas-core' && github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'schedule' && vars.SOMBRA_AGENDA_ATIVA == 'true'))
    environment: sombra
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DAYS: ${{ github.event.inputs.days || '6' }}
      MIN_DAYS: ${{ github.event.inputs.min_days }}
      SINCE: ${{ github.event.inputs.since }}
      UNTIL: ${{ github.event.inputs.until }}
      JANELA_INICIO: ${{ vars.SOMBRA_JANELA_INICIO || '2026-11-23T00:00:00-03:00' }}
      JANELA_FIM: ${{ vars.SOMBRA_JANELA_FIM || '2026-11-28T00:00:00-03:00' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - run: go build -o bin/kas-shadow-summary ./cmd/kas-shadow-summary
      - name: Escolher a janela
        run: |
          NOW=$(date -u +%s) deploy/sombra/janela-resumo.sh >> "$GITHUB_ENV"
          cat "$GITHUB_ENV" | grep -E '^(SINCE|UNTIL|MIN_DAYS|FASE)=' || true
      - name: Baixar e decifrar os relatórios
        env:
          PASS: ${{ secrets.SOMBRA_REPORT_PASSPHRASE }}
        run: |
          since=$(date -u -d "-${DAYS} days" +%Y-%m-%dT%H:%M:%SZ)
          if [ -n "$SINCE" ]; then
            # Execuções que podem ter ciclos na janela: começam até 6 h antes do início dela.
            s=$(date -u -d "$SINCE" +%s) || { echo "::error::since inválido"; exit 1; }
            since=$(date -u -d "@$((s - 21600))" +%Y-%m-%dT%H:%M:%SZ)
          fi
          mkdir -p dl all
          gh run list -R "$GITHUB_REPOSITORY" -w sombra-reaper.yml -L 200 --json databaseId,createdAt,status \
            -q ".[] | select(.status==\"completed\" and .createdAt >= \"$since\") | .databaseId" > runs.txt
          echo "execuções no período: $(wc -l < runs.txt)"
          while read -r id; do
            gh run download "$id" -R "$GITHUB_REPOSITORY" -D "dl/$id" >/dev/null 2>&1 || continue
            for f in dl/$id/*/*.gpg; do
              [ -f "$f" ] || continue
              printf '%s' "$PASS" | gpg --batch --quiet --pinentry-mode loopback --passphrase-fd 0 -d "$f" | tar xz -C "dl/$id"
              [ -f "dl/$id/run/report.jsonl" ] && cp "dl/$id/run/report.jsonl" "all/report-$id.jsonl"
              [ -f "dl/$id/run/health.jsonl" ] && cp "dl/$id/run/health.jsonl" "all/health-$id.jsonl"
            done
          done < runs.txt
          ls all | wc -l
      - name: Avaliar os critérios
        run: |
          ls all/report-*.jsonl >/dev/null 2>&1 || { echo "nenhum relatório no período" >> "$GITHUB_STEP_SUMMARY"; exit 0; }
          H=$(ls all/health-*.jsonl 2>/dev/null | paste -sd, -)
          set +e
          W=(); [ -n "$SINCE$UNTIL" ] && W=(-since "$SINCE" -until "$UNTIL")
          bin/kas-shadow-summary -min-days "$MIN_DAYS" "${W[@]}" ${H:+-health "$H"} all/report-*.jsonl > summary.md
          rc=$?
          set -e
          echo "Fase: $FASE" >> "$GITHUB_STEP_SUMMARY"
          L="VEREDITO"; case "$FASE" in veredito*|manual) ;; *) L="RESULTADO PARCIAL (não é o veredito)";; esac
          cat summary.md >> "$GITHUB_STEP_SUMMARY"
          case $rc in
            0) echo "$L: todos os critérios passam" >> "$GITHUB_STEP_SUMMARY" ;;
            3) echo "$L: nada reprovado; período ainda curto" >> "$GITHUB_STEP_SUMMARY" ;;
            4) echo "$L: INCONCLUSIVO; nada reprovado, mas zero candidatos ou zero conferências: não houve o que comparar com o Node" >> "$GITHUB_STEP_SUMMARY" ;;
            *) echo "$L: há critério reprovado"   >> "$GITHUB_STEP_SUMMARY"; exit 1 ;;
          esac
          rm -rf dl all
