name: KAS Core CI

on:
  push:
    branches:
      - kas-core/validacao-core
      - kas-core/operacional
      - kas-core/event-reaper
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Go and Node integration checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kas
          POSTGRES_PASSWORD: kas_teste_ci
          POSTGRES_DB: kas_core_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kas -d kas_core_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Disposable CI database with fictitious credentials; no external data.
      KAS_TEST_DATABASE_URL: postgres://kas:kas_teste_ci@localhost:5432/kas_core_test?sslmode=disable
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Disposable MongoDB (single-node replica set) for the event reaper
        run: |
          docker run -d --name mongo -p 127.0.0.1:27017:27017 mongo:7 --replSet rs0 --bind_ip_all
          for i in $(seq 1 30); do docker exec mongo mongosh --quiet --eval 'db.runCommand({ping:1}).ok' && break; sleep 1; done
          docker exec mongo mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"127.0.0.1:27017"}]})'
          for i in $(seq 1 30); do [ "$(docker exec mongo mongosh --quiet --eval 'db.hello().isWritablePrimary')" = true ] && break; sleep 1; done
          echo "KAS_TEST_MONGO_URI=mongodb://127.0.0.1:27017/?directConnection=true" >> "$GITHUB_ENV"

      - name: Legacy oracle (unmodified CRM reaper) dependencies
        working-directory: legacy-oracle/eventreaper
        run: |
          npm install --no-audit --no-fund
          echo "KAS_TEST_ORACLE_DIR=$GITHUB_WORKSPACE/legacy-oracle/eventreaper" >> "$GITHUB_ENV"

      - name: Legacy oracle v2 (CRM reaper with execution ownership) dependencies
        working-directory: legacy-oracle/eventreaper-v2
        run: |
          npm install --no-audit --no-fund
          echo "KAS_TEST_ORACLE_V2_DIR=$GITHUB_WORKSPACE/legacy-oracle/eventreaper-v2" >> "$GITHUB_ENV"

      - name: Legacy oracle (unmodified CRM outbox dispatcher) dependencies
        working-directory: legacy-oracle/outbox
        run: |
          npm install --no-audit --no-fund
          echo "KAS_TEST_ORACLE_OUTBOX_DIR=$GITHUB_WORKSPACE/legacy-oracle/outbox" >> "$GITHUB_ENV"

      - name: Legacy oracle (unmodified CRM alert service), no dependencies
        run: echo "KAS_TEST_ORACLE_ALERTS_DIR=$GITHUB_WORKSPACE/legacy-oracle/alerts" >> "$GITHUB_ENV"

      - name: Go tests
        run: go test ./...

      - name: Static analysis
        run: go vet ./...

      - name: Go race detector
        env:
          CGO_ENABLED: "1"
        run: go test -race ./...

      - name: Node unit and process integration tests
        working-directory: node-integration
        run: npm test

  docker:
    name: Docker image and compose stack
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Build the image
        run: docker build -t kas-core:ci .

      - name: The image runs as a non-root user
        run: |
          user="$(docker image inspect --format '{{.Config.User}}' kas-core:ci)"
          echo "image user: $user"
          test "$user" = "65532:65532"

      - name: The static binary starts (a missing configuration exits with code 2)
        run: |
          set +e
          docker run --rm kas-core:ci -config /nonexistent
          code=$?
          echo "exit code: $code"
          test "$code" -eq 2

      - name: The compose file is valid
        run: |
          ./scripts/dev-certs.sh
          docker compose config --quiet

      - name: Start the stack and run the smoke test
        run: |
          docker compose up -d --build kas
          ./scripts/compose-smoke.sh

      - name: Container logs (on failure)
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v

  integrated:
    name: Integrated CRM + KAS (deploy/integrado/run.sh, CRM Node guard on)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # PR único do CRM (item 4 + API/workers reais do item 7). Depois do merge, voltar para main.
      # Repositório público; nada de segredo, banco descartável e dados fictícios.
      CRM_REPO: kaduart/fono-inova-crm-back
      CRM_REF: main
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Check out the CRM (public)
        uses: actions/checkout@v7
        with:
          repository: ${{ env.CRM_REPO }}
          ref: ${{ env.CRM_REF }}
          path: crm

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: CRM dependencies
        working-directory: crm
        run: |
          echo "CRM em $(git rev-parse HEAD)"
          npm ci --no-audit --no-fund

      - name: Run the integrated script (items 7, 9 and guard cases G1-G5)
        # Só passa se o roteiro chegou ao fim ("TUDO OK"): uma saída antecipada com código 0
        # (ex.: exec de um processo em primeiro plano) não pode virar verde.
        run: |
          set -o pipefail
          CRM_DIR="$GITHUB_WORKSPACE/crm" WORK="$RUNNER_TEMP/integrado" deploy/integrado/run.sh 2>&1 | tee "$RUNNER_TEMP/integrado.log"
          grep -q '^TUDO OK$' "$RUNNER_TEMP/integrado.log"

      - name: Logs (on failure)
        if: failure()
        run: |
          for f in "$RUNNER_TEMP"/integrado/*.log; do echo "=== $f"; tail -n 60 "$f"; done

  sombra:
    name: Shadow reaper isolated validation (deploy/sombra/validate.sh)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Check out the CRM (public)
        uses: actions/checkout@v7
        with:
          repository: kaduart/fono-inova-crm-back
          ref: main
          path: crm

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: CRM dependencies
        working-directory: crm
        run: npm ci --no-audit --no-fund

      - name: Schedule window never overlaps the next slot (deploy/sombra/janela.sh)
        run: deploy/sombra/janela_test.sh

      - name: Public diagnostics never print password or host
        run: deploy/sombra/diagnostico_test.sh

      - name: Run S1-S6 (authenticated Mongo, same role as Atlas, real CRM reaper)
        run: |
          set -o pipefail
          CRM_DIR="$GITHUB_WORKSPACE/crm" WORK="$RUNNER_TEMP/sombra" deploy/sombra/validate.sh 2>&1 | tee "$RUNNER_TEMP/sombra.log"
          grep -q '^TUDO OK$' "$RUNNER_TEMP/sombra.log"

      - name: Logs (on failure)
        if: failure()
        run: |
          for f in "$RUNNER_TEMP"/sombra/*.log; do echo "=== $f"; tail -n 60 "$f"; done
