name: KAS Core CI

on:
  push:
    branches:
      - kas-core/validacao-core
      - kas-core/operacional
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Go and Node integration checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kas
          POSTGRES_PASSWORD: kas_teste_ci
          POSTGRES_DB: kas_core_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kas -d kas_core_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Disposable CI database with fictitious credentials; no external data.
      KAS_TEST_DATABASE_URL: postgres://kas:kas_teste_ci@localhost:5432/kas_core_test?sslmode=disable
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Go tests
        run: go test ./...

      - name: Static analysis
        run: go vet ./...

      - name: Go race detector
        env:
          CGO_ENABLED: "1"
        run: go test -race ./...

      - name: Node unit and process integration tests
        working-directory: node-integration
        run: npm test

  docker:
    name: Docker image and compose stack
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Build the image
        run: docker build -t kas-core:ci .

      - name: The image runs as a non-root user
        run: |
          user="$(docker image inspect --format '{{.Config.User}}' kas-core:ci)"
          echo "image user: $user"
          test "$user" = "65532:65532"

      - name: The static binary starts (a missing configuration exits with code 2)
        run: |
          set +e
          docker run --rm kas-core:ci -config /nonexistent
          code=$?
          echo "exit code: $code"
          test "$code" -eq 2

      - name: The compose file is valid
        run: |
          ./scripts/dev-certs.sh
          docker compose config --quiet

      - name: Start the stack and run the smoke test
        run: |
          docker compose up -d --build kas
          ./scripts/compose-smoke.sh

      - name: Container logs (on failure)
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v
